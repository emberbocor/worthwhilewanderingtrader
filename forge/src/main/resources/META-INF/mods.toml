modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/emberbocor/worthwhilewanderingtrader/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/emberbocor/worthwhilewanderingtrader"
authors="emberbocor"
displayTest="IGNORE_SERVER_VERSION"
description='''
Replaces the wandering trader's trades with rare and useful goods, and lets it buy leftover items from players. Every trade is set in the server config.
Only needed on the server: players without the mod can join and trade normally.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
